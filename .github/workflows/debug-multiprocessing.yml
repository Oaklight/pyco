name: debug-multiprocessing

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYCO_VERSION: "3.14"
  PYCO_TARGET: "linux-x86_64"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Install conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate-base: true
      - name: Cache verified CPython sources
        uses: actions/cache@v4
        with:
          path: sources/
          key: pyco-sources-${{ hashFiles('configs/versions.toml') }}
      - name: Create locked conda environment
        shell: bash -el {0}
        env:
          PYCO_CONDA_PREFIX: ${{ runner.temp }}/pyco-env
        run: |
          conda create --yes --prefix "$PYCO_CONDA_PREFIX" \
            --file conda-linux-64.lock \
            --override-channels -c conda-forge
      - name: Install gdbm ndbm compatibility
        shell: bash -el {0}
        env:
          PYCO_CONDA_PREFIX: ${{ runner.temp }}/pyco-env
        run: ./scripts/install-gdbm-compat.sh "$PYCO_CONDA_PREFIX"
      - name: Build and diagnose multiprocessing tests
        shell: bash -el {0}
        env:
          PYCO_CONDA_PREFIX: ${{ runner.temp }}/pyco-env
        run: |
          export PATH="$PYCO_CONDA_PREFIX/bin:$PATH"
          export PYTHONPATH="$PWD"
          ./scripts/fetch.sh "$PYCO_VERSION"
          ./scripts/build.sh "$PYCO_VERSION" baseline "$PYCO_TARGET" --jobs "$(nproc)"
          prefix="$PWD/out/v3.14.9/$PYCO_TARGET/baseline"
          python="$prefix/bin/python3.14"
          export LD_LIBRARY_PATH="$prefix/lib:$PYCO_CONDA_PREFIX/lib"
          tests_root="$PWD/results/v3.14.9/$PYCO_TARGET/baseline/tests"
          mkdir -p "$tests_root/tmp"
          export TMPDIR="$tests_root/tmp"
          cd "$tests_root"
          echo "nproc=$(nproc)"
          ulimit -a
          set +e
          "$python" -m test -v -j1 --timeout 1200
          code=$?
          echo "test exit code: $code"
          exit "$code"
