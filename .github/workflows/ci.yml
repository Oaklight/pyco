name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SNUGPY_VERSION: "3.14"
  SNUGPY_TARGET: "linux-x86_64"

jobs:
  unit:
    name: Unit checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q snugpy_build tests benchmarks
      - name: Show configured matrix
        run: python -m snugpy_build.cli list
      - name: Verify dry-run environment
        run: python -m snugpy_build.cli build 3.14 size linux-x86_64 --dry-run

  build:
    name: Build ${{ matrix.profile }}
    needs: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [baseline, size, lto, static, clang-oz, lean]
    steps:
      - uses: actions/checkout@v4
      - name: Install conda
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: base
          auto-activate-base: true
      - name: Cache verified CPython sources
        uses: actions/cache@v4
        with:
          path: sources/
          key: snugpy-sources-${{ hashFiles('configs/versions.toml') }}
      - name: Create locked conda environment
        shell: bash -el {0}
        env:
          SNUGPY_CONDA_PREFIX: ${{ runner.temp }}/snugpy-env
        run: |
          conda create --yes --prefix "$SNUGPY_CONDA_PREFIX" \
            --file conda-linux-64.lock \
            --override-channels -c conda-forge
      - name: Install gdbm ndbm compatibility
        shell: bash -el {0}
        env:
          SNUGPY_CONDA_PREFIX: ${{ runner.temp }}/snugpy-env
        run: ./scripts/install-gdbm-compat.sh "$SNUGPY_CONDA_PREFIX"
      - name: Build, test, package, and measure
        shell: bash -el {0}
        env:
          SNUGPY_CONDA_PREFIX: ${{ runner.temp }}/snugpy-env
          PROFILE: ${{ matrix.profile }}
        run: |
          export PATH="$SNUGPY_CONDA_PREFIX/bin:$PATH"
          export PYTHONPATH="$PWD"
          python --version
          ./scripts/fetch.sh "$SNUGPY_VERSION" --zerodep
          ./scripts/build.sh "$SNUGPY_VERSION" "$PROFILE" "$SNUGPY_TARGET" --jobs "$(nproc)"
          ./scripts/test.sh "$SNUGPY_VERSION" "$PROFILE" "$SNUGPY_TARGET" --smoke
          ./scripts/package.sh "$SNUGPY_VERSION" "$PROFILE" "$SNUGPY_TARGET"
          ./scripts/measure.sh "$SNUGPY_VERSION" "$PROFILE" "$SNUGPY_TARGET" --runs 5
      - name: Show failure logs
        if: failure()
        shell: bash
        run: |
          while IFS= read -r -d '' log_file; do
            echo "===== ${log_file}"
            tail -80 "${log_file}"
          done < <(find results -type f -path '*/logs/*.log' -print0)
      - name: Upload profile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snugpy-${{ matrix.profile }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/**/*.json
            results/**/logs/*.log
            dist/*.tar.xz

  static-lean:
    name: Build static-lean (Debian 12)
    needs: unit
    runs-on: ubuntu-24.04
    container: debian:bookworm
    timeout-minutes: 180
    env:
      DEBIAN_FRONTEND: noninteractive
      SNUGPY_CONDA_PREFIX: /opt/snugpy-env
    steps:
      - uses: actions/checkout@v4
      - name: Trust cached source trees
        run: git config --global --add safe.directory '*'
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            binutils ca-certificates curl file git gzip make patch pkg-config \
            xz-utils zlib1g-dev libbz2-dev libdb-dev libexpat1-dev libffi-dev \
            libgdbm-dev libgdbm-compat-dev liblzma-dev libncurses-dev \
            libreadline-dev libsqlite3-dev libssl-dev libzstd-dev tk-dev \
            uuid-dev libbrotli-dev
      - name: Install conda
        run: |
          curl --fail --location --silent --show-error \
            "https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh" \
            -o /tmp/miniforge.sh
          bash /tmp/miniforge.sh -b -p /opt/miniforge3
          echo "/opt/miniforge3/bin" >> "$GITHUB_PATH"
      - name: Cache verified CPython sources
        uses: actions/cache@v4
        with:
          path: sources/
          key: snugpy-sources-${{ hashFiles('configs/versions.toml') }}
      - name: Create locked conda environment
        run: |
          conda create --yes --prefix "$SNUGPY_CONDA_PREFIX" \
            --file conda-linux-64.lock \
            --override-channels -c conda-forge
      - name: Install gdbm ndbm compatibility
        run: ./scripts/install-gdbm-compat.sh "$SNUGPY_CONDA_PREFIX"
      - name: Build, test, package, and measure
        shell: bash
        run: |
          export PATH="$SNUGPY_CONDA_PREFIX/bin:$PATH"
          export PYTHONPATH="$PWD"
          python --version
          ./scripts/fetch.sh "$SNUGPY_VERSION" --zerodep
          ./scripts/build.sh "$SNUGPY_VERSION" static-lean "$SNUGPY_TARGET" --jobs "$(nproc)"
          ./scripts/test.sh "$SNUGPY_VERSION" static-lean "$SNUGPY_TARGET" --smoke
          ./scripts/package.sh "$SNUGPY_VERSION" static-lean "$SNUGPY_TARGET"
          ./scripts/measure.sh "$SNUGPY_VERSION" static-lean "$SNUGPY_TARGET" --runs 5
      - name: Verify external library ABI
        run: ./scripts/check-abi.sh "out/v3.14.9/linux-x86_64/static-lean"
      - name: Show failure logs
        if: failure()
        shell: bash
        run: |
          while IFS= read -r -d '' log_file; do
            echo "===== ${log_file}"
            tail -80 "${log_file}"
          done < <(find results -type f -path '*/logs/*.log' -print0)
      - name: Upload profile results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snugpy-static-lean
          if-no-files-found: warn
          retention-days: 14
          path: |
            results/**/*.json
            results/**/logs/*.log
            dist/*.tar.xz

  runtime-image:
    name: Measure runtime image
    needs: static-lean
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download static-lean artifact
        uses: actions/download-artifact@v4
        with:
          name: snugpy-static-lean
          path: .
      - name: Build and smoke-test runtime image
        run: |
          mkdir -p results/v3.14.9/linux-x86_64/static-lean
          ./scripts/image-size.sh "$SNUGPY_VERSION" static-lean "$SNUGPY_TARGET" \
            debian:bookworm-slim runtime |
            tee results/v3.14.9/linux-x86_64/static-lean/runtime-image.txt
      - name: Upload image measurement
        uses: actions/upload-artifact@v4
        with:
          name: snugpy-runtime-image
          if-no-files-found: error
          retention-days: 14
          path: results/v3.14.9/linux-x86_64/static-lean/runtime-image.txt

  aggregate:
    name: Aggregate report
    needs: [build, static-lean]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download profile results
        uses: actions/download-artifact@v4
        with:
          pattern: snugpy-*
          merge-multiple: true
          path: .
      - name: Generate report
        run: python -m snugpy_build.cli report
      - name: Show report
        run: cat results/report.md
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: snugpy-report
          path: |
            results/summary.csv
            results/report.md
