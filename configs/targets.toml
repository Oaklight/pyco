schema_version = 1

[targets."linux-x86_64"]
platform = "linux"
arch = "x86_64"
runner = "ubuntu-24.04"
container_image = "debian:bookworm"
glibc_baseline = "2.36"
build_backend = "configure"
apt_packages = [
  "binutils",
  "build-essential",
  "ca-certificates",
  "clang",
  "curl",
  "file",
  "g++",
  "gcc",
  "git",
  "gzip",
  "hyperfine",
  "libbrotli-dev",
  "libbz2-dev",
  "libdb-dev",
  "libexpat1-dev",
  "libffi-dev",
  "libgdbm-compat-dev",
  "libgdbm-dev",
  "liblzma-dev",
  "libncurses-dev",
  "libreadline-dev",
  "libsqlite3-dev",
  "libssl-dev",
  "libzstd-dev",
  "lld",
  "llvm",
  "make",
  "netbase",
  "patch",
  "patchelf",
  "pkg-config",
  "python3",
  "python3-pip",
  "python3-venv",
  "tar",
  "time",
  "tk-dev",
  "uuid-dev",
  "xz-utils",
  "zlib1g-dev",
]
notes = "Conda profiles build on the Ubuntu runner. The static-lean profile builds in Debian 12 against system libraries and targets glibc 2.36. Verify artifact symbol requirements with objdump -T before any release claim."

