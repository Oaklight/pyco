schema_version = 1
default = "headless"

[variants.headless]
description = "Runtime without tests, development archives, IDLE, or Tk GUI support."
exclude = [
  "lib/python*/test",
  "lib/python*/idlelib",
  "lib/python*/tkinter",
  "lib/python*/lib-dynload/_tkinter*",
  "lib/python*/config-*/libpython*.a",
  "lib/python*/config-*/python.o",
  "bin/idle*",
]
smoke_imports = ["ssl", "sqlite3", "ctypes"]

[variants.headed]
description = "Runtime with IDLE and Tk GUI support, without tests or development archives."
exclude = [
  "lib/python*/test",
  "lib/python*/config-*/libpython*.a",
  "lib/python*/config-*/python.o",
]
smoke_imports = ["ssl", "sqlite3", "ctypes", "tkinter"]

[variants.test]
description = "Complete installation including the CPython test suite and development files."
exclude = []
smoke_imports = ["ssl", "sqlite3", "ctypes", "test"]

[variants.micro]
description = "Runtime-only: no package installer, tests, docs, headers, or development files."
exclude = [
  "lib/python*/test",
  "lib/python*/idlelib",
  "lib/python*/tkinter",
  "lib/python*/lib-dynload/_tkinter*",
  "lib/python*/ensurepip",
  "lib/python*/site-packages",
  "lib/python*/pydoc_data",
  "lib/python*/unittest",
  "lib/python*/turtledemo",
  "lib/python*/venv",
  "lib/python*/config-*",
  "lib/python*/lib-dynload/_test*",
  "lib/python*/lib-dynload/_curses*",
  "lib/python*/lib-dynload/_dbm*",
  "lib/python*/lib-dynload/_gdbm*",
  "lib/python*/lib-dynload/readline*",
  "lib/python*/lib-dynload/xxlimited*",
  "lib/python*/lib-dynload/_xxtestfuzz*",
  "include",
  "share",
  "lib/pkgconfig",
  "bin/pip*",
  "bin/idle*",
  "bin/python*-config",
]
smoke_imports = ["ssl", "sqlite3", "ctypes", "json", "asyncio"]

[variants.nano]
description = "Micro runtime without precompiled bytecode; modules compile on first import."
exclude = [
  "lib/python*/test",
  "lib/python*/idlelib",
  "lib/python*/tkinter",
  "lib/python*/lib-dynload/_tkinter*",
  "lib/python*/ensurepip",
  "lib/python*/site-packages",
  "lib/python*/pydoc_data",
  "lib/python*/unittest",
  "lib/python*/turtledemo",
  "lib/python*/venv",
  "lib/python*/config-*",
  "lib/python*/lib-dynload/_test*",
  "lib/python*/lib-dynload/_curses*",
  "lib/python*/lib-dynload/_dbm*",
  "lib/python*/lib-dynload/_gdbm*",
  "lib/python*/lib-dynload/readline*",
  "lib/python*/lib-dynload/xxlimited*",
  "lib/python*/lib-dynload/_xxtestfuzz*",
  "lib/python*/__pycache__",
  "include",
  "share",
  "lib/pkgconfig",
  "bin/pip*",
  "bin/idle*",
  "bin/python*-config",
]
smoke_imports = ["ssl", "sqlite3", "ctypes", "json", "asyncio"]

[variants.runtime]
description = "Micro layout with preinstalled site-packages, but no pip or ensurepip."
exclude = [
  "lib/python*/test",
  "lib/python*/idlelib",
  "lib/python*/tkinter",
  "lib/python*/lib-dynload/_tkinter*",
  "lib/python*/ensurepip",
  "lib/python*/pydoc_data",
  "lib/python*/unittest",
  "lib/python*/turtledemo",
  "lib/python*/venv",
  "lib/python*/config-*",
  "lib/python*/lib-dynload/_test*",
  "lib/python*/lib-dynload/_curses*",
  "lib/python*/lib-dynload/_dbm*",
  "lib/python*/lib-dynload/_gdbm*",
  "lib/python*/lib-dynload/readline*",
  "lib/python*/lib-dynload/xxlimited*",
  "lib/python*/lib-dynload/_xxtestfuzz*",
  "lib/python*/site-packages/pip",
  "lib/python*/site-packages/pip-*.dist-info",
  "lib/python*/site-packages/setuptools",
  "lib/python*/site-packages/setuptools-*.dist-info",
  "lib/python*/site-packages/pkg_resources",
  "lib/python*/site-packages/_distutils_hack",
  "lib/python*/site-packages/distutils-precedence.pth",
  "include",
  "share",
  "lib/pkgconfig",
  "bin/pip*",
  "bin/idle*",
  "bin/python*-config",
]
smoke_imports = ["ssl", "sqlite3", "ctypes", "json", "asyncio"]
