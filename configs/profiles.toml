schema_version = 1

[profiles.baseline]
description = "Upstream default optimization with shared libpython"
cc = "gcc"
cxx = "g++"
configure = ["--enable-shared", "--with-ensurepip=install"]
cflags = ""
cppflags = ""
cxxflags = ""
ldflags = ""
experimental = false

[profiles.size]
description = "Size-oriented code generation with shared libpython"
cc = "gcc"
cxx = "g++"
configure = ["--enable-shared", "--with-ensurepip=install"]
cflags = "-Os"
cppflags = ""
cxxflags = ""
ldflags = ""
experimental = false

[profiles.lto]
description = "Size optimization plus link-time optimization"
cc = "gcc"
cxx = "g++"
configure = ["--enable-shared", "--with-ensurepip=install", "--with-lto"]
cflags = "-Os"
cppflags = ""
cxxflags = ""
ldflags = ""
experimental = false

[profiles.static]
description = "Static libpython linkage into the executable"
cc = "gcc"
cxx = "g++"
configure = ["--disable-shared", "--with-ensurepip=install"]
cflags = "-Os"
cppflags = ""
cxxflags = ""
ldflags = ""
experimental = false

[profiles."clang-oz"]
description = "Aggressive size-oriented code generation with Clang"
cc = "clang"
cxx = "clang++"
configure = ["--enable-shared", "--with-ensurepip=install"]
cflags = "-Oz"
cppflags = ""
cxxflags = ""
ldflags = ""
experimental = true

[profiles.lean]
description = "Clang -Oz with docstrings removed and unused sections discarded"
cc = "clang"
cxx = "clang++"
configure = ["--enable-shared", "--with-ensurepip=install", "--without-doc-strings"]
cflags = "-Oz -ffunction-sections -fdata-sections -fno-asynchronous-unwind-tables -fno-ident"
cppflags = ""
cxxflags = ""
ldflags = "-Wl,--gc-sections -Wl,--build-id=none"
experimental = true

[profiles."static-lean"]
description = "Static libpython with Clang -Oz, Debian system external libs, non-PIE link, LLD ICF, and no unwind tables"
cc = "clang"
cxx = "clang++"
configure = ["--disable-shared", "--with-ensurepip=install", "--without-doc-strings"]
cflags = "-no-default-config --gcc-toolchain=/usr -Oz -ffunction-sections -fdata-sections -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-ident -fvisibility=hidden -fno-semantic-interposition"
cppflags = ""
cxxflags = "-no-default-config --gcc-toolchain=/usr -Oz -ffunction-sections -fdata-sections -fno-asynchronous-unwind-tables -fno-unwind-tables -fno-ident -fvisibility=hidden -fvisibility-inlines-hidden -fno-semantic-interposition"
ldflags = "-no-default-config --gcc-toolchain=/usr -fuse-ld=lld -no-pie -Wl,--gc-sections -Wl,--icf=all -Wl,--build-id=none -Wl,--as-needed -Wl,--export-dynamic -Wl,-O2"
external_libs = "system"
experimental = true
