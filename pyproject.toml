[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "snugpy"
dynamic = ["version"]
description = "Build and measure compact, full-compatibility CPython distributions"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_LICENSES.md", "licenses/CPython-PSF-LICENSE.txt"]
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0; python_version < '3.11'",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Software Development :: Build Tools",
]

[project.scripts]
snugpy = "snugpy_build.cli:main"

[project.urls]
Repository = "https://github.com/Oaklight/snugpy"
Issues = "https://github.com/Oaklight/snugpy/issues"

[tool.setuptools]
packages = ["snugpy_build"]

[tool.setuptools.dynamic]
version = { attr = "snugpy_build.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
